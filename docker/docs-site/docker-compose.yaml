services:
  rsplayer-docs:
    container_name: rsplayer-docs
    build:
      context: ../..
      dockerfile: docker/docs-site/Dockerfile
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rsdocs_http.entrypoints=web"
      - "traefik.http.routers.rsdocs_http.rule=Host(`docs.rsplayer.de`)"
      - "traefik.http.routers.rsdocs_http.middlewares=rsdocs-https-redirect"
      - "traefik.http.middlewares.rsdocs-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.rsdocs_https.entrypoints=websecure"
      - "traefik.http.routers.rsdocs_https.tls=true"
      - "traefik.http.routers.rsdocs_https.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.rsdocs_https.rule=Host(`docs.rsplayer.de`)"
      - "traefik.http.routers.rsdocs_https.service=rsplayer-docs"
      - "traefik.http.services.rsplayer-docs.loadbalancer.server.port=80"

networks:
  default:
    external:
      name: proxy
