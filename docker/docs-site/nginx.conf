server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Privacy policy promises visitor IPs are never written to disk: no access log,
    # and no "file not found" entries (they include the client IP) in the error log.
    access_log off;
    log_not_found off;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript text/markdown image/svg+xml;

    # docsify fetches *.md files at runtime; keep them fresh, cache assets
    location ~* \.md$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /_assets/ {
        add_header Cache-Control "public, max-age=86400";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
