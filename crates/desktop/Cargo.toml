[package]
name = "rsplayer-desktop"
version.workspace = true
authors = ["Dragan Ljubojevic <dragan.ljubojevic@gmail.com>"]
edition = "2024"
description = "RSPlayer Desktop"

# cargo-packager configuration (DMG on macOS; Linux uses Tauri bundler for deb+rpm).
# Build the binary with `--features custom-protocol`, then run e.g.:
#   cargo packager -p rsplayer-desktop --release --target <triple> --formats dmg
# product name, version, identifier and binaries are derived from this manifest.
[package.metadata.packager]
product-name = "RSPlayer"
identifier = "io.github.ljufa.rsplayer"
category = "Music"
icons = [
    "icons/icon.icns",
    "icons/icon.ico",
    "icons/icon.png",
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png"
]

# Tauri mobile layout: the app lives in the library (loaded by the Android
# host via `System.loadLibrary`), the desktop binary is a thin shim over it.
[lib]
name = "rsplayer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rsplayer-desktop"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)', 'cfg(desktop)'] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
api_models = { path = "../api_models" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

# OS media keys (MPRIS2 / MediaRemote / SMTC) and the per-user config dir —
# neither applies on Android, where the Kotlin media session and the app's
# private files dir take over.
[target.'cfg(not(target_os = "android"))'.dependencies]
souvlaki = "0.8"
dirs = "7"

# Android: logcat logger and the ndk-context registration that cpal's AAudio
# host and iroh's interface discovery require.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
ndk-context = "0.1"

# ALSA only exists on Linux; on macOS the server is built without default features
# (mirrors the headless server release builds for apple-darwin targets).
[target.'cfg(target_os = "linux")'.dependencies]
rsplayer = { path = "../server" }

# Windows: no ALSA, but enable ASIO output (requires ASIO SDK + LLVM at build time).
[target.'cfg(target_os = "windows")'.dependencies]
rsplayer = { path = "../server", default-features = false, features = ["asio"] }

# macOS and Android (and any other non-Linux, non-Windows): no ALSA, no ASIO —
# cpal's CoreAudio / AAudio host with the "System Default" device.
[target.'cfg(all(not(target_os = "linux"), not(target_os = "windows")))'.dependencies]
rsplayer = { path = "../server", default-features = false }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
