name: Deploy docs

# Deploys the docsify site (docs/) to https://docs.rsplayer.de whenever the public main changes
# it. Runs on the VPS itself (self-hosted runner with label `rsplayer-docs`), which also hosts
# Traefik, so it just rebuilds the local nginx container (docker/docs-site/). No SSH or secrets.
# The runner user must be able to run docker / docker-compose and the `proxy` network must exist.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docker/docs-site/**"
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, rsplayer-docs]
    steps:
      - uses: actions/checkout@v4
        with:
          # own subfolder: cd.yml jobs on this runner leave root-owned files in the
          # shared workspace root, which would make checkout's cleanup fail (EACCES)
          path: docs-src
          sparse-checkout: |
            docs
            docker/docs-site

      - name: Rebuild and restart the container
        working-directory: docs-src/docker/docs-site
        run: docker-compose up -d --build

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 https://docs.rsplayer.de/_sidebar.md > /dev/null
