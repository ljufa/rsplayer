name: Full release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target to build"
        required: true
        default: "all"
        type: choice
        options:
          # all = every build below (same as a tag push); any other option runs exactly one build job
          - all
          # Headless server (deb/rpm/tgz/binary) for one target
          - arm-unknown-linux-gnueabihf
          - armv7-unknown-linux-gnueabihf
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          # Linux desktop app packages (deb/rpm/tgz)
          - desktop-x86_64
          - desktop-aarch64
          # Sandboxed Linux desktop app
          - snap-amd64
          - snap-arm64
          - flatpak-amd64
          - flatpak-arm64
          # macOS (server binary + desktop DMG) per CPU, Windows (server exe + installer)
          - macos-aarch64
          - macos-x86_64
          - windows
          # Android app (universal APK), built on the self-hosted runner labelled "android"
          - android
  push:
    tags:
      - "*.*.*"

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_ui:
    name: Build UI
    runs-on: [self-hosted, linux, x64]
    container:
      image: ghcr.io/${{ github.repository_owner }}/rsplayer-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The release version single source of truth is [workspace.package] in Cargo.toml.
      # Fail fast if a tag is pushed that does not match it.
      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag '${{ github.ref_name }}' does not match workspace version '$version' in Cargo.toml"
            exit 1
          fi
      # - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo make build_ui_release

      - name: Upload web public dir
        uses: actions/upload-artifact@v7
        with:
          name: web_ui
          path: dist/web-ui

  build_backend:
    needs: build_ui
    name: Release Backend
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || contains(fromJSON('["arm-unknown-linux-gnueabihf","armv7-unknown-linux-gnueabihf","aarch64-unknown-linux-gnu","x86_64-unknown-linux-gnu","riscv64gc-unknown-linux-gnu"]'), inputs.target) }}
    runs-on: [self-hosted, linux, x64]
    container:
      image: ghcr.io/${{ github.repository_owner }}/rsplayer-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Mount host Docker socket so cross can launch cross-compilation containers
      options: -v /var/run/docker.sock:/var/run/docker.sock
    env:
      # Tell cross it is running inside a container so it doesn't try to mount
      # ~/.cargo / ~/.rustup from the host (those paths resolve on the host machine,
      # not inside this builder container, causing "cargo: not found" in cross containers)
      CROSS_CONTAINER_IN_CONTAINER: "true"
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.target != 'all' && format('["{0}"]', inputs.target)) || '["arm-unknown-linux-gnueabihf","armv7-unknown-linux-gnueabihf","aarch64-unknown-linux-gnu","x86_64-unknown-linux-gnu","riscv64gc-unknown-linux-gnu"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      # - uses: Swatinem/rust-cache@v2
      #   with:
      #     key: ${{ matrix.target }}

      - name: Download web_ui
        uses: actions/download-artifact@v8
        with:
          name: web_ui
          path: dist/web-ui

      # cross only pulls its image when it is missing, so a self-hosted runner
      # keeps building in a stale cached :latest after build-images.yml
      # pushes a new one. Pull the image Cross.toml names for this target.
      - name: Pull latest cross image
        run: |
          image=$(grep -A1 '^\[target.${{ matrix.target }}\]' Cross.toml | grep image | cut -d'"' -f2)
          docker pull "$image"

      - name: Build release binary
        run: cargo make --env TARGET=${{ matrix.target }} build_release

      # Produces all final-named release assets in target/<target>/pkg/:
      # rsplayer_<ver>_<suffix>.deb / .rpm / .tgz and the raw rsplayer_<suffix> binary
      - name: Package release assets (deb, rpm, arch tgz, binary)
        run: cargo make --env TARGET=${{ matrix.target }} package_linux_release

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.target }}
          path: target/${{ matrix.target }}/pkg/*
          if-no-files-found: error

  build_desktop_linux:
    needs: build_ui
    name: Build Desktop (deb+rpm+arch tgz)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'desktop-x86_64' }}
    runs-on: [self-hosted, linux, x64]
    container:
      image: ghcr.io/${{ github.repository_owner }}/rsplayer-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      # - uses: Swatinem/rust-cache@v2
      #   with:
      #     key: desktop-linux-x86_64

      - name: Download web_ui
        uses: actions/download-artifact@v8
        with:
          name: web_ui
          path: dist/web-ui

      - name: Build Desktop (deb+rpm)
        run: cargo make --env TARGET=x86_64-unknown-linux-gnu bundle_desktop_release

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg-desktop-linux-x86_64
          path: target/cross/x86_64-unknown-linux-gnu/pkg/*
          if-no-files-found: error

  build_desktop_linux_arm64:
    needs: build_ui
    name: Build Desktop arm64 (deb+rpm+arch tgz)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'desktop-aarch64' }}
    # Raspberry Pi 4/5 and other ARM64 desktops. Cross-built like the aarch64
    # server: cross compiles in the rsplayer-cross-aarch64 image (which also
    # carries the arm64 WebKitGTK dev libs), then tauri bundles the binaries
    # into deb/rpm here in the builder container.
    runs-on: [self-hosted, linux, x64]
    container:
      image: ghcr.io/${{ github.repository_owner }}/rsplayer-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Mount host Docker socket so cross can launch its build container
      options: -v /var/run/docker.sock:/var/run/docker.sock
    env:
      # Same as build_backend: cross runs inside this container
      CROSS_CONTAINER_IN_CONTAINER: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Download web_ui
        uses: actions/download-artifact@v8
        with:
          name: web_ui
          path: dist/web-ui

      # Same as build_backend: make sure cross uses the current image (with the
      # arm64 WebKitGTK libs), not a stale cached :latest on the runner.
      - name: Pull latest cross image
        run: |
          image=$(grep -A1 '^\[target.aarch64-unknown-linux-gnu\]' Cross.toml | grep image | cut -d'"' -f2)
          docker pull "$image"

      - name: Build Desktop (deb+rpm+arch tgz)
        run: cargo make bundle_desktop_release_aarch64

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg-desktop-linux-aarch64
          path: target/aarch64-unknown-linux-gnu/pkg/rsplayer-desktop*
          if-no-files-found: error

  build_snap:
    needs: build_ui
    name: Build Snap (${{ matrix.arch }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'snap-amd64' || inputs.target == 'snap-arm64' }}
    # GitHub-hosted runners: snapcore/action-build needs snapd + LXD, which
    # are not available inside the self-hosted builder container. snapcraft
    # builds for the runner's own architecture, so arm64 uses a native runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.target == 'snap-amd64' && '[{"runner":"ubuntu-latest","arch":"amd64"}]') || (github.event_name == 'workflow_dispatch' && inputs.target == 'snap-arm64' && '[{"runner":"ubuntu-24.04-arm","arch":"arm64"}]') || '[{"runner":"ubuntu-latest","arch":"amd64"},{"runner":"ubuntu-24.04-arm","arch":"arm64"}]') }}
    steps:
      - uses: actions/checkout@v7

      # Same pre-seeding as the flatpak: the web UI is not built inside the
      # snap; snapcraft packs the working tree with dist/web-ui in place.
      - name: Download web_ui
        uses: actions/download-artifact@v8
        with:
          name: web_ui
          path: dist/web-ui

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Upload snap package
        uses: actions/upload-artifact@v7
        with:
          name: pkg-snap-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

      # Uploaded to the candidate channel; promote to stable manually after
      # smoke-testing (see PKGS/snap/README.md). Requires the
      # SNAPCRAFT_STORE_CREDENTIALS secret (snapcraft export-login).
      - name: Publish to Snap Store (candidate)
        if: startsWith(github.ref, 'refs/tags/')
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: candidate

  build_flatpak:
    needs: build_ui
    name: Build Flatpak (${{ matrix.arch }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'flatpak-amd64' || inputs.target == 'flatpak-arm64' }}
    # GitHub-hosted runners: flatpak-builder needs bwrap/user namespaces,
    # which are not available inside the self-hosted builder container.
    # flatpak-builder builds for the runner's own architecture (emulating
    # aarch64 would take hours for the Rust build), so arm64 uses a native runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.target == 'flatpak-amd64' && '[{"runner":"ubuntu-latest","arch":"amd64"}]') || (github.event_name == 'workflow_dispatch' && inputs.target == 'flatpak-arm64' && '[{"runner":"ubuntu-24.04-arm","arch":"arm64"}]') || '[{"runner":"ubuntu-latest","arch":"amd64"},{"runner":"ubuntu-24.04-arm","arch":"arm64"}]') }}
    steps:
      - uses: actions/checkout@v7

      # Same pre-seeding as the snap: the web UI is not built inside the
      # flatpak; the staged source tree carries dist/web-ui pre-built.
      - name: Download web_ui
        uses: actions/download-artifact@v8
        with:
          name: web_ui
          path: dist/web-ui

      - name: Install flatpak-builder and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      # The flatpak build is offline; vendor all crates from Cargo.lock
      # (same as `cargo make flatpak_cargo_sources` locally).
      - name: Generate cargo-sources.json
        run: |
          curl -sfLo flatpak-cargo-generator.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 -m venv venv
          venv/bin/pip -q install aiohttp toml tomlkit
          venv/bin/python3 flatpak-cargo-generator.py Cargo.lock -o PKGS/flatpak/cargo-sources.json

      - name: Build flatpak
        run: |
          bash PKGS/flatpak/stage-sources.sh target/flatpak/src
          cp PKGS/flatpak/io.github.ljufa.rsplayer.yml PKGS/flatpak/cargo-sources.json target/flatpak/
          cd target/flatpak
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=repo build-dir io.github.ljufa.rsplayer.yml

      - name: Bundle single-file .flatpak release asset
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p pkg
          flatpak build-bundle target/flatpak/repo pkg/rsplayer-desktop_${version}_${{ matrix.arch }}.flatpak io.github.ljufa.rsplayer master

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: pkg-flatpak-${{ matrix.arch }}
          path: pkg/*
          if-no-files-found: error

      # Publishing to the self-hosted flatpak repo happens later, when the
      # (draft, pre-release) GitHub release is promoted to a full release —
      # see .github/workflows/flatpak-repo.yml, which imports the bundle
      # uploaded above.

  build_desktop_macos:
    needs: build_ui
    name: Build macOS (DMG + server binary)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-aarch64' || inputs.target == 'macos-x86_64' }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon (macos-14) and Intel (macos-15-intel); a single-target dispatch builds one of them
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.target == 'macos-aarch64' && '[{"platform":"macos-14","rust_target":"aarch64-apple-darwin","bin_suffix":"darwin_arm64"}]') || (github.event_name == 'workflow_dispatch' && inputs.target == 'macos-x86_64' && '[{"platform":"macos-15-intel","rust_target":"x86_64-apple-darwin","bin_suffix":"darwin_amd64"}]') || '[{"platform":"macos-14","rust_target":"aarch64-apple-darwin","bin_suffix":"darwin_arm64"},{"platform":"macos-15-intel","rust_target":"x86_64-apple-darwin","bin_suffix":"darwin_amd64"}]') }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # - uses: Swatinem/rust-cache@v2
      #   with:
      #     key: ${{ matrix.target }}

      - name: Download web_ui
        uses: actions/download-artifact@v8
        with:
          name: web_ui
          path: dist/web-ui

      - name: Install cargo-packager
        run: cargo install cargo-packager

      - name: Build headless server binary
        run: cargo build --package rsplayer --bin rsplayer --release --no-default-features --target ${{ matrix.rust_target }}

      - name: Build desktop app and DMG
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cargo build --package rsplayer-desktop --release --features custom-protocol --target ${{ matrix.rust_target }}
          cargo packager --packages rsplayer-desktop --release --target ${{ matrix.rust_target }} --formats dmg

      - name: Stage release assets
        run: |
          mkdir -p pkg
          cp target/${{ matrix.rust_target }}/release/*.dmg pkg/
          cp target/${{ matrix.rust_target }}/release/rsplayer pkg/rsplayer_${{ matrix.bin_suffix }}

      - name: Upload macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.rust_target }}
          path: pkg/*
          if-no-files-found: error

  build_desktop_windows:
    needs: build_ui
    name: Build Windows (headless exe + NSIS installer)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: [self-hosted, windows, x64]
    # ASIO output is linked into every Windows build. bindgen (via asio-sys)
    # needs libclang. This runner is self-hosted, so LLVM, Rust (rustup), the
    # MSVC C++ Build Tools and Git must be pre-installed on the machine — see
    # docs/build.md "Self-hosted Windows runner". LIBCLANG_PATH points at the
    # LLVM install.
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7

      # rustup is pre-installed on the runner; just make sure the toolchain and
      # MSVC target are present. Done in pwsh so we don't depend on bash (the
      # dtolnay/rust-toolchain action is a bash composite action, which a bare
      # Windows runner has no shell for).
      # - name: Install Rust toolchain
      #   shell: pwsh
      #   run: |
      #     rustup toolchain install stable --profile minimal
      #     rustup target add x86_64-pc-windows-msvc

      # - uses: Swatinem/rust-cache@v2
      #   with:
      #     key: desktop-windows-x86_64

      # ASIO SDK (Steinberg). The SDK is downloaded, not vendored, per its
      # license — redistributing the SDK is prohibited; shipping compiled
      # binaries is permitted. asio-sys reads CPAL_ASIO_DIR to locate it.
      - name: Cache ASIO SDK
        id: cache-asio
        uses: actions/cache@v6
        with:
          path: asiosdk
          key: asio-sdk-2.3.3

      - name: Download ASIO SDK
        if: steps.cache-asio.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri 'https://www.steinberg.net/asiosdk' -OutFile asiosdk.zip -UseBasicParsing
          Expand-Archive -Path asiosdk.zip -DestinationPath asiosdk -Force

      - name: Set CPAL_ASIO_DIR
        shell: powershell
        run: |
          $dir = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE/asiosdk" -Directory | Select-Object -First 1).FullName
          echo "CPAL_ASIO_DIR=$dir" >> $env:GITHUB_ENV

      - name: Download web_ui
        uses: actions/download-artifact@v8
        with:
          name: web_ui
          path: dist/web-ui

      # - name: Install tauri-cli
      #   run: cargo install tauri-cli --version "^2" --locked

      - name: Build headless server binary
        run: cargo build --package rsplayer --bin rsplayer --release --no-default-features --features asio --target x86_64-pc-windows-msvc

      - name: Build desktop app and NSIS installer
        shell: powershell
        run: |
          Copy-Item crates/desktop/loading.html dist/web-ui/loading.html
          cd crates/desktop
          cargo tauri build --bundles nsis --ci

      - name: Stage release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          $installer = Get-ChildItem -Recurse -Filter *-setup.exe | Select-Object -First 1
          Copy-Item $installer.FullName pkg/rsplayer-desktop_windows_amd64.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/rsplayer.exe pkg/rsplayer_windows_amd64.exe

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: pkg-x86_64-pc-windows-msvc
          path: pkg/*
          if-no-files-found: error

  build_android:
    needs: build_ui
    name: Build Android (APK)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
    # The runner labelled "android" is the maintainer's workstation: the Android SDK/NDK,
    # a JDK and the rust android targets are installed there (docs/build.md, Android)
    # rather than downloaded on every run.
    runs-on: [self-hosted, linux, x64, android]
    steps:
      # This job runs on the host as the runner user, while container jobs that land on
      # the same runner write the shared workspace as root. Hand such files back first,
      # or checkout cannot clean the workspace ("Permission denied" on .git/index.lock).
      - name: Reclaim workspace from container jobs
        run: |
          for dir in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            if [ -n "$(find "$dir" ! -user "$(id -u)" -print -quit 2>/dev/null)" ]; then
              echo "Taking back root-owned files in $dir"
              docker run --rm -v "$dir:/reclaim" alpine:3 chown -R "$(id -u):$(id -g)" /reclaim
            fi
          done

      - uses: actions/checkout@v7
        with:
          clean: true

      # Runner services start without a login shell, so resolve the toolchain from the
      # conventional locations; the NDK version comes from the Gradle project.
      - name: Check Android toolchain
        run: |
          android_home="${ANDROID_HOME:-$HOME/Android/Sdk}"
          ndk_version=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' crates/desktop/gen/android/app/build.gradle.kts)
          ndk_home="${NDK_HOME:-$android_home/ndk/$ndk_version}"
          java_home="${JAVA_HOME:-$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.home = //p')}"
          missing=0
          for dir in "$android_home/platforms" "$ndk_home" "$java_home"; do
            if [ -z "$dir" ] || [ ! -d "$dir" ]; then
              echo "::error::Missing '$dir' (see docs/build.md, Android)"
              missing=1
            fi
          done
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            if ! rustup target list --installed | grep -qx "$target"; then
              echo "::error::Rust target $target is not installed"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          {
            echo "ANDROID_HOME=$android_home"
            echo "NDK_HOME=$ndk_home"
            echo "JAVA_HOME=$java_home"
          } >> "$GITHUB_ENV"

      - name: Download web_ui
        uses: actions/download-artifact@v8
        with:
          name: web_ui
          path: dist/web-ui

      # Release key from repository secrets. Without them the APK is signed with the
      # runner's debug key: it installs, but switching keys later forces users to
      # uninstall, so set the secrets before publishing a release.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with the runner's debug key"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rsplayer-release.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/rsplayer-release.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > crates/desktop/gen/android/keystore.properties

      - name: Build Android APK
        run: cargo make bundle_android_release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: pkg-android
          path: target/android/pkg/*.apk
          if-no-files-found: error

      # Self-hosted workspace persists between runs: never leave the signing key behind.
      - name: Remove signing key
        if: always()
        run: rm -f crates/desktop/gen/android/keystore.properties "$RUNNER_TEMP/rsplayer-release.jks"

  publish:
    # Collects every build's artifacts (and creates the draft release on tag pushes) —
    # only meaningful for a full run, so single-build dispatches skip it.
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.target == 'all') }}
    needs: [build_backend, build_desktop_macos, build_desktop_linux, build_desktop_linux_arm64, build_desktop_windows, build_snap, build_flatpak, build_android]
    name: Create release
    runs-on: [self-hosted, linux, x64]
    steps:
      # All artifacts already carry their final release asset names
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: release_assets
          merge-multiple: true

      - name: List release assets
        run: ls -R release_assets

      - name: Create release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: "release_assets/*"
          draft: true
          prerelease: true
          generateReleaseNotes: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
