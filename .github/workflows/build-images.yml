name: Build builder images

on:
  push:
    branches: [main_public]
    paths:
      - 'docker/Dockerfile.*'
      - 'docker/Dockerfile.android'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      image:
        description: "Which image(s) to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - builder
          - cross-linux
          - cross-armv6
          - cross-armv7
          - cross-aarch64
          - cross-x86_64
          - cross-riscv64
          - android-builder

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  builder:
    name: Build builder image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.image == 'all' || github.event.inputs.image == 'builder' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.builder
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rsplayer-builder:latest
          cache-from: type=gha,scope=rsplayer-builder
          cache-to: type=gha,mode=max,scope=rsplayer-builder

  cross-armv6:
    name: Cross image armv6
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.image == 'all' || github.event.inputs.image == 'cross-linux' || github.event.inputs.image == 'cross-armv6' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.cross-armv6
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rsplayer-cross-armv6:latest
          cache-from: type=gha,scope=cross-armv6
          cache-to: type=gha,mode=max,scope=cross-armv6

  cross-aarch64:
    name: Cross image aarch64
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.image == 'all' || github.event.inputs.image == 'cross-linux' || github.event.inputs.image == 'cross-aarch64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.cross-aarch64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rsplayer-cross-aarch64:latest
          cache-from: type=gha,scope=cross-aarch64
          cache-to: type=gha,mode=max,scope=cross-aarch64

  cross-armv7:
    name: Cross image armv7
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.image == 'all' || github.event.inputs.image == 'cross-linux' || github.event.inputs.image == 'cross-armv7' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.cross-armv7
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rsplayer-cross-armv7:latest
          cache-from: type=gha,scope=cross-armv7
          cache-to: type=gha,mode=max,scope=cross-armv7

  cross-x86_64:
    name: Cross image x86_64
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.image == 'all' || github.event.inputs.image == 'cross-linux' || github.event.inputs.image == 'cross-x86_64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.cross-x86_64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rsplayer-cross-x86_64:latest
          cache-from: type=gha,scope=cross-x86_64
          cache-to: type=gha,mode=max,scope=cross-x86_64

  cross-riscv64:
    name: Cross image riscv64
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.image == 'all' || github.event.inputs.image == 'cross-linux' || github.event.inputs.image == 'cross-riscv64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.cross-riscv64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rsplayer-cross-riscv64:latest
          cache-from: type=gha,scope=cross-riscv64
          cache-to: type=gha,mode=max,scope=cross-riscv64

  android-builder:
    # Builds the Android app in the same environment F-Droid's buildserver uses (Debian
    # trixie, the same pinned Rust/dx/tauri-cli/NDK versions), so cd.yml's build_android job
    # produces APKs byte-identical to F-Droid's own build (reproducible builds; see
    # docker/Dockerfile.android and docs/build.md). Rebuild after any change to that file or to
    # the versions pinned in crates/desktop/android-build-env.sh.
    name: Android builder image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.image == 'all' || github.event.inputs.image == 'android-builder' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.android
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rsplayer-android-builder:latest
          cache-from: type=gha,scope=android-builder
          cache-to: type=gha,mode=max,scope=android-builder
