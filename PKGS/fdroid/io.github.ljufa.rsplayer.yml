Categories:
  - Multimedia
License: MIT
AuthorName: Dragan Ljubojevic
WebSite: https://ljufa.github.io/rsplayer/
SourceCode: https://github.com/ljufa/rsplayer
IssueTracker: https://github.com/ljufa/rsplayer/issues
Changelog: https://github.com/ljufa/rsplayer/releases

AutoName: RSPlayer

RepoType: git
Repo: https://github.com/ljufa/rsplayer.git

Builds:
  - versionName: 4.9.6
    versionCode: 4009006
    commit: v4.9.6
    subdir: crates/desktop/gen/android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm build-essential pkg-config
    output: build/outputs/apk/universal/release/app-universal-release.apk
    rm:
      - dist
    prebuild:
      - curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - . $HOME/.cargo/env
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android wasm32-unknown-unknown
      - cargo install --locked cargo-make dioxus-cli tauri-cli --version '^2'
    build:
      - export RELEASE_VERSION=$$VERSION$$
      - . $HOME/.cargo/env  
      - cd ../../../../..
      - cargo make build_ui_release
      - printf '#!/bin/sh\nexec gradlew-fdroid "$@"\n' > crates/desktop/gen/android/gradlew
      - chmod +x crates/desktop/gen/android/gradlew
      - cp crates/desktop/loading.html dist/web-ui/loading.html
      - cd crates/desktop && cargo tauri android build --apk --target aarch64 --target armv7 --target x86_64 --ci
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 4.9.6
CurrentVersionCode: 4009006
