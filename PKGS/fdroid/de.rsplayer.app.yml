AuthorEmail: support@rsplayer.de
WebSite: https://docs.rsplayer.de/
SourceCode: https://github.com/ljufa/rsplayer
IssueTracker: https://github.com/ljufa/rsplayer/issues
Changelog: https://github.com/ljufa/rsplayer/releases

AutoName: RSPlayer

RepoType: git
Repo: https://github.com/ljufa/rsplayer.git

Builds:
  - versionName: 4.9.8
    versionCode: 40090081
    commit: 4.9.8
    subdir: crates/desktop/gen/android/app
    sudo:
      - apt-get update
      - apt-get install -y build-essential pkg-config libclang-dev libssl-dev
      - apt-get install -y nodejs npm binaryen rustup openjdk-21-jdk-headless
    output: build/outputs/apk/universal/release/app-universal-release.apk
    build:
      - rustup default 1.98.1
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - rustup target add x86_64-linux-android wasm32-unknown-unknown
      - export NDK_HOME=$$NDK$$
      - cargo install cargo-make@0.37.24 --locked
      - cargo install dioxus-cli@0.7.10 --locked
      - cargo install wasm-bindgen-cli@0.2.127 --locked
      - cargo install tauri-cli@2.11.4 --locked
      - export RELEASE_VERSION=$$VERSION$$
      - cd ../../../../..
      - cargo make build_ui_release
      - cd crates/desktop
      - printf '#!/bin/sh\nexec gradlew-fdroid "$@"\n' > gen/android/gradlew
      - chmod +x gen/android/gradlew
      - cp loading.html ../../dist/web-ui/loading.html
      - export RSPLAYER_ABI_CODE=1
      - cargo tauri android build --apk --ci --target armv7
    ndk: r28c

