# Loaded via ALSA_CONFIG_PATH after alsa-snap.conf, chosen by alsa-select when
# the host sound server is PipeWire (Ubuntu 22.10 and later, Fedora). Routes
# the ALSA "default" PCM straight to PipeWire through the staged pipewire-alsa
# plugin, like the Flatpak runtime does. The pulse plugin route (asound.conf)
# underruns constantly on these hosts.

pcm.!default {
    type pipewire
    playback_node "-1"
    capture_node "-1"
    hint {
        show on
        description "Default ALSA Output (PipeWire Media Server)"
    }
}

ctl.!default {
    type pipewire
}
