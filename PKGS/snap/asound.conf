# Loaded via ALSA_CONFIG_PATH after alsa-snap.conf (the staged alsa.conf
# minus the hooks that load host ALSA config), chosen by alsa-select when the
# host sound server is plain PulseAudio (e.g. Ubuntu 22.04). On a PipeWire
# host alsa-select loads asound-pipewire.conf instead: going through the
# pulse plugin and pipewire-pulse underruns there.
#
# Routes the ALSA "default" PCM to PulseAudio, served on the host through the
# audio-playback interface, with a direct sysdefault fallback when no sound
# server is running. hw: devices are unaffected and enumerate normally once
# the alsa interface is connected.

pcm.!default {
    type pulse
    fallback "sysdefault"
    hint {
        show on
        description "Default ALSA Output (PulseAudio Sound Server)"
    }
}

ctl.!default {
    type pulse
    fallback "sysdefault"
}
